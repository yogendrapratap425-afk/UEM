          path: extracted/EasiBoard/app/build/outputs/apk/debug/app-debug.apk
name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q EasiBoard.zip -d extracted

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> extracted/EasiBoard/gradle.properties
          echo "android.nonTransitiveRClass=true" >> extracted/EasiBoard/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: extracted/EasiBoard
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasiBoard-debug-apk
          path: extracted/EasiBoard/app/build/outputs/apk/debug/app-debug.apk
